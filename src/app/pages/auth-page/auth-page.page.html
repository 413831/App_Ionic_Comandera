<ion-content id="container" class="fondo">
  <div id="container">
    <img src="./assets/img/icono_food.png" alt="" style="max-width: 200px;">

    <ion-button (click)="mostrarLogin($event)" expand="block" size="large" color="danger">
      Iniciar sesión
    </ion-button>
    <ion-button (click)="mostrarDemoRoles($event)" expand="block" size="medium" color="warning">
      <ion-icon slot="start" name="flash-outline"></ion-icon>
      Demo Rápida (Portfolio)
    </ion-button>
    <ion-button (click)="mostrarRegistro($event)" size="medium" color="dark">
      Registro
    </ion-button>
  </div>

</ion-content>
